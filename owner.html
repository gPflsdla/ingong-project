<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>사장님 화면 · SafeOrder</title>
  <link rel="icon" href="images/logo-safeorder.svg" type="image/svg+xml">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/owner.css">
</head>
<body class="owner">
  <div class="wrap wide">
    <!-- 11단계: 사장님 화면 (PRD #4-5) -->
    <header class="owner-head">
      <div>
        <a class="brand" href="./" title="처음 화면"><img src="images/logo-safeorder.svg" alt="" width="30" height="30"><span class="wordmark">Safe<span>Order</span></span><span class="brand-sub">사장님 화면</span></a>
        <div class="store">
          <img class="store-logo" src="images/logo-hallabunsik.png" alt="" width="64" height="64">
          <h1 id="storeName"></h1>
        </div>
      </div>
      <div class="conn" id="conn" hidden>
        <span class="dot" aria-hidden="true"></span><span id="connText"></span>
        <button type="button" class="btn" id="logoutBtn">나가기</button>
      </div>
    </header>

    <!-- 가게 코드 입력 (11-1) -->
    <section class="panel login" id="login">
      <h2>가게 코드를 입력하세요</h2>
      <p class="hint">가게 코드를 넣으면 들어온 주문을 실시간으로 받을 수 있어요. 넣은 코드는 이 기기에만 기억해요.</p>
      <form id="loginForm">
        <input type="password" id="code" autocomplete="current-password" aria-label="가게 코드" required>
        <button type="submit" class="btn primary">주문 받기 시작</button>
      </form>
      <p class="form-msg err" id="loginMsg" role="alert"></p>
      <!-- 12-11: 평가하시는 분이 바로 체험할 수 있게 체험용 코드를 공개 -->
      <div class="demo-code">
        <p><b>체험용 가게 코드</b> <code>gagae1111</code></p>
        <p class="hint">과제 시연용 코드라 누구나 볼 수 있어요. 주문은 24시간 뒤 자동으로 지워져요.</p>
        <button type="button" class="btn" id="demoFill">체험용 코드로 들어가기</button>
      </div>
    </section>

    <!-- 주문 목록 (11-2 ~ 11-4) -->
    <main id="board" hidden>
      <div class="board-tools">
        <div class="summary-row" id="summaryRow"></div>
        <button type="button" class="btn reset" id="resetAll">전체 지우기</button>
      </div>
      <!-- 12-13: 손님 호출 (물, 직원, 수저 등) -->
      <section class="calls" id="callsBox" hidden>
        <h2 class="col-title">손님 호출</h2>
        <div id="callList"></div>
      </section>
      <section>
        <h2 class="col-title">들어온 주문 <span class="hint">알레르기 주문이 맨 위에 와요</span></h2>
        <div class="orders" id="active"></div>
      </section>
      <details class="done-box">
        <summary>조리 완료 <span id="doneCount"></span></summary>
        <div class="orders" id="done"></div>
      </details>
    </main>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="js/restrictions.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/owner.js"></script>
</body>
</html>
