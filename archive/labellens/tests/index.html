<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabelLens 판정 테스트</title>
  <style>
    :root { --bg: #F4F5F8; --surface: #FFFFFF; --ink: #161A2B; --muted: #5D6377; --line: #DFE2EA; --pass: #167A49; --pass-soft: #E1F3E9; --fail: #C0262D; --fail-soft: #FCE7E8; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #10121B; --surface: #181B28; --ink: #E7E9F2; --muted: #9EA3B8; --line: #2A2E40; --pass: #6ED39E; --pass-soft: #17302A; --fail: #FF7A80; --fail-soft: #3A1E22; color-scheme: dark; } }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; font-size: 14px; line-height: 1.6; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .total { font-size: 18px; font-weight: 700; padding: 12px 16px; border-radius: 10px; margin: 12px 0; }
    .total.pass { background: var(--pass-soft); color: var(--pass); } .total.fail { background: var(--fail-soft); color: var(--fail); }
    .tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; color: var(--muted); }
    td.r { font-weight: 700; white-space: nowrap; } td.r.pass { color: var(--pass); } td.r.fail { color: var(--fail); }
    code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
    .why { color: var(--fail); font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>판정 테스트</h1>
    <p>js/matcher.js가 성분을 맞게 찾고 판정하는지 확인합니다. 성분 사전이나 규칙을 고친 뒤에는 이 페이지를 새로고침해서 모두 통과하는지 봅니다.</p>
    <div class="total" id="total">실행 중…</div>
    <div class="tbl"><table><thead><tr><th>#</th><th>결과</th><th>확인하는 것</th><th>입력</th><th>설정</th></tr></thead><tbody id="rows"></tbody></table></div>
  </div>

  <script src="../js/restrictions.js"></script>
  <script src="../js/dictionary.js"></script>
  <script src="../js/matcher.js"></script>
  <script src="../js/samples.js"></script>
  <script>
  (function () {
    "use strict";
    // has: 찾아야 하는 라벨 표기, notTags: 붙으면 안 되는 태그, verdict: 기대 판정
    function P(diets, allergies) { return { diets: diets || [], allergies: allergies || [] }; }
    var CASES = [
      { what: "소맥분을 밀로 인식", text: "소맥분, 설탕", prefs: P([], ["wheat"]), verdict: "bad", has: ["소맥분"] },
      { what: "땅콩버터는 땅콩이지 우유가 아님", text: "땅콩버터", prefs: P([], ["milk", "peanut"]), verdict: "bad", has: ["땅콩버터"], notTags: ["milk"] },
      { what: "카카오버터는 식물성", text: "카카오버터, 설탕", prefs: P(["vegan"], ["milk"]), verdict: "ok", notTags: ["milk"] },
      { what: "밀크초콜릿의 '밀'은 밀이 아님", text: "밀크초콜릿", prefs: P([], ["wheat"]), verdict: "ok", notTags: ["wheat"] },
      { what: "밀크는 우유", text: "밀크초콜릿", prefs: P([], ["milk"]), verdict: "bad", has: ["밀크"] },
      { what: "알레르기 표시줄의 한 글자 '밀'", text: "밀, 대두 함유", prefs: P([], ["wheat", "soy"]), verdict: "bad", has: ["밀", "대두"] },
      { what: "'부드럽게'의 '게'는 게가 아님", text: "부드럽게 즐기는 과자, 설탕, 밀가루", prefs: P([], ["crab"]), verdict: "ok", notTags: ["crab"] },
      { what: "돈지는 돼지고기 (할랄 불가)", text: "돈지(돼지고기), 소금", prefs: P(["halal"]), verdict: "bad", has: ["돈지", "돼지고기"] },
      { what: "젤라틴은 할랄 확인 필요", text: "젤라틴, 설탕", prefs: P(["halal"]), verdict: "warn", has: ["젤라틴"] },
      { what: "발효주정은 알코올 (할랄 불가)", text: "정제수, 발효주정", prefs: P(["halal"]), verdict: "bad", has: ["발효주정"] },
      { what: "쇠고기는 할랄 확인 필요 (먹을 수 없음 아님)", text: "쇠고기추출물", prefs: P(["halal"]), verdict: "warn", has: ["쇠고기추출물"] },
      { what: "벌꿀은 비건 불가", text: "벌꿀, 레몬", prefs: P(["vegan"]), verdict: "bad", has: ["벌꿀"] },
      { what: "계란은 채식(락토오보) 가능", text: "계란, 우유", prefs: P(["vegetarian"]), verdict: "ok" },
      { what: "간장은 글루텐 프리에서 확인 필요", text: "간장, 설탕", prefs: P(["glutenfree"]), verdict: "warn", has: ["간장"] },
      { what: "코코넛밀크는 비건 가능", text: "코코넛밀크, 설탕", prefs: P(["vegan"]), verdict: "ok", notTags: ["milk"] },
      { what: "줄바꿈으로 쪼개진 '젤\\n라틴'", text: "설탕, 젤\n라틴, 소금", prefs: P(["halal"]), verdict: "warn", has: ["젤라틴"] },
      { what: "굴소스는 조개류", text: "굴소스, 마늘", prefs: P([], ["shellfish"]), verdict: "bad", has: ["굴소스"] },
      { what: "한 글자 '굴'도 항목이면 조개류", text: "굴, 전복", prefs: P([], ["shellfish"]), verdict: "bad", has: ["굴", "전복"] },
      { what: "아황산나트륨은 아황산류", text: "아황산나트륨(보존료)", prefs: P([], ["sulfite"]), verdict: "bad", has: ["아황산나트륨"] },
      { what: "띄어쓰기가 섞여도 인식", text: "소 맥 분, 탈지 분유", prefs: P([], ["wheat", "milk"]), verdict: "bad", has: ["소맥분", "탈지분유"] },
      { what: "아무것도 안 고르면 판정 없음", text: "돈지", prefs: P(), verdict: "none" },
      { what: "예시: 초코 과자 + 할랄", text: LL.SAMPLES[0].text, prefs: P(["halal"]), verdict: "bad", has: ["돼지", "젤라틴"] },
      { what: "같은 제조시설의 땅콩은 '혼입 가능성' (먹을 수 없음 아님)", text: LL.SAMPLES[0].text, prefs: P([], ["peanut"]), verdict: "warn", reason: { level: "warn", kind: "facility", target: "peanut" } },
      { what: "라면: 같은 제조시설의 돼지고기는 할랄 판정에 안 씀", text: LL.SAMPLES[1].text, prefs: P(["nopork"]), verdict: "ok", noReasonKind: "diet" },
      { what: "아는 성분이 하나도 없으면 '판단할 수 없음'", text: "가나다라, 마바사, 아자차", prefs: P(["vegan"]), verdict: "unknown" },
      { what: "흔한 원재료(정제수, 과당, 구연산)도 인식 → 비건 문제 없음", text: "정제수, 과당, 구연산", prefs: P(["vegan"]), verdict: "ok", has: ["정제수", "과당", "구연산"] },
      { what: "돼지감자는 식물 (돼지고기 아님)", text: "돼지감자, 정제수", prefs: P(["halal"]), verdict: "ok", has: ["돼지감자"], notTags: ["pork"] },
      { what: "황도는 복숭아", text: "황도, 설탕", prefs: P([], ["peach"]), verdict: "bad", has: ["황도"] },
      { what: "레시틴은 대두 알레르기 확인 필요", text: "설탕, 레시틴", prefs: P([], ["soy"]), verdict: "warn", has: ["레시틴"] },
      { what: "캔 음료 원재료 12개 모두 인식", text: "정제수, 설탕, 기타과당, 구연산, 그레이프후르츠과즙(남아공산), 구연산삼나트륨, 향료, 정제소금(국산), 비타민C, 염화칼륨, 젖산칼슘, 염화마그네슘", prefs: P(["vegan"]), verdict: "ok", count: [12, 12] },
      { what: "인식 개수: 모르는 원재료는 따로 셈", text: "원재료명: 설탕, 가나다, 소맥분(밀:미국산)\n밀 함유", prefs: P([], ["wheat"]), verdict: "bad", count: [2, 3] },
      { what: "엉터리 글자만 있으면 '판단할 수 없음'", text: "0265 ..ㅡ×허은 도22 기 .2322", prefs: P(["halal"]), verdict: "unknown" },
      { what: "같은 제조시설 문장만 있으면 '판단할 수 없음'", text: "이 제품은 땅콩을 사용한 제품과 같은 제조시설에서 제조하고 있습니다.", prefs: P([], ["peanut"]), verdict: "unknown" },
      { what: "예시: 라면 + 할랄 (주정 때문에 불가)", text: LL.SAMPLES[1].text, prefs: P(["halal"]), verdict: "bad", has: ["발효주정", "쇠고기추출물"] },
      { what: "예시: 복숭아 음료 + 비건", text: LL.SAMPLES[2].text, prefs: P(["vegan"]), verdict: "ok" },
      { what: "예시: 복숭아 음료 + 복숭아 알레르기", text: LL.SAMPLES[2].text, prefs: P([], ["peach"]), verdict: "bad", has: ["복숭아"] }
    ];

    function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }
    var passed = 0, rows = "";
    CASES.forEach(function (tc, i) {
      var hits = LL.findIngredients(tc.text), reasons = LL.evaluate(hits, tc.prefs), v = LL.verdict(hits, tc.reasons || reasons, tc.prefs);
      var found = hits.map(function (h) { return h.entry.ko; }), tags = [].concat.apply([], hits.map(function (h) { return h.entry.tags; }));
      var errors = [];
      if (v !== tc.verdict) errors.push("판정 " + v + " (기대 " + tc.verdict + ")");
      (tc.has || []).forEach(function (k) { if (found.indexOf(k) === -1) errors.push("'" + k + "'를 못 찾음"); });
      (tc.notTags || []).forEach(function (t) { if (tags.indexOf(t) !== -1) errors.push("'" + t + "' 태그가 붙음"); });
      if (tc.reason && !reasons.some(function (r) { return r.level === tc.reason.level && r.kind === tc.reason.kind && r.target === tc.reason.target; })) errors.push("기대한 이유(" + tc.reason.kind + ", " + tc.reason.target + ")가 없음");
      if (tc.count) { var cnt = LL.countItems(tc.text); if (cnt.known !== tc.count[0] || cnt.total !== tc.count[1]) errors.push("인식 개수 " + cnt.known + "/" + cnt.total + " (기대 " + tc.count[0] + "/" + tc.count[1] + ")"); }
      if (tc.noReasonKind && reasons.some(function (r) { return r.kind === tc.noReasonKind; })) errors.push("'" + tc.noReasonKind + "' 이유가 나오면 안 됨");
      var ok = errors.length === 0; if (ok) passed++;
      rows += "<tr><td>" + (i + 1) + '</td><td class="r ' + (ok ? "pass" : "fail") + '">' + (ok ? "통과" : "실패") + "</td><td>" + esc(tc.what) +
        (ok ? "" : '<div class="why">' + esc(errors.join(", ")) + "</div>") + "<br><small>찾은 성분: " + esc(found.join(", ") || "없음") + "</small></td><td><code>" +
        esc(tc.text.length > 60 ? tc.text.slice(0, 60) + "…" : tc.text) + "</code></td><td>" + esc(tc.prefs.diets.concat(tc.prefs.allergies).join(", ") || "없음") + "</td></tr>";
    });
    document.getElementById("rows").innerHTML = rows;
    var total = document.getElementById("total");
    total.textContent = CASES.length + "개 중 " + passed + "개 통과" + (passed === CASES.length ? " ✓" : "");
    total.className = "total " + (passed === CASES.length ? "pass" : "fail");
    document.documentElement.setAttribute("data-result", passed + "/" + CASES.length);
  })();
  </script>
</body>
</html>
